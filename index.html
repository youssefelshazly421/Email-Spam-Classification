<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Email Classifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 700px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📧 Spam Email Classifier</h1>

    <p class="description">
        Enter an email message and let the AI model classify it.
    </p>

    <textarea id="emailText"
        placeholder="Enter your email here..."></textarea>

    <button onclick="checkEmail()">
        Check Email
    </button>

    <div id="result"></div>

</div>


<script>

async function checkEmail() {

    const email = document.getElementById("emailText").value;
    const result = document.getElementById("result");

    if (email.trim() === "") {
        result.style.display = "block";
        result.innerHTML = "⚠️ Please enter an email.";
        return;
    }

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/predict?email=" +
            encodeURIComponent(email),
            {
                method: "POST"
            }
        );

        const data = await response.json();

        result.style.display = "block";

        if (data.result === "SPAM") {

            result.innerHTML = "🚨 This email is SPAM";

        } else {

            result.innerHTML = "✅ This email is NOT SPAM";

        }

    } catch (error) {

        result.style.display = "block";
        result.innerHTML =
            "❌ Could not connect to the AI server.";

    }
}

</script>

</body>
</html>
